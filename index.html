<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación de Pensamiento Analítico</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #contenedor-juego {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 700px;
            width: 100%;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 {
            margin: 0;
            font-size: 20px;
            color: #2c3e50;
        }
        #marcador {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #34495e;
            padding: 8px 16px;
            border-radius: 20px;
        }
        .etiqueta-situacion {
            font-size: 14px;
            color: #e67e22;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 24px;
        }
        p {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #4f5b66;
        }
        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            background-color: #fff;
            color: #2c3e50;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-align: left;
            transition: all 0.2s ease;
        }
        button:hover {
            background-color: #f8f9fa;
            border-color: #34495e;
            transform: translateX(5px);
        }
        .btn-siguiente {
            background-color: #3498db;
            color: white;
            border: none;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }
        .btn-siguiente:hover {
            background-color: #2980b9;
            transform: none;
        }
    </style>
</head>
<body>

<div id="contenedor-juego">
    <header>
        <h1>Orientación Educativa</h1>
        <div id="marcador">Puntos: 0</div>
    </header>
    
    <span id="etiqueta-situacion" class="etiqueta-situacion"></span>
    <h2 id="titulo-escenario">Cargando...</h2>
    <p id="texto-escenario">Preparando los módulos...</p>
    
    <div id="botones-opciones">
        </div>
</div>

<script>
    let puntuacionActual = 0;
    const puntuacionMaxima = 100; // 5 situaciones x 2 preguntas x 10 puntos

    // Base de datos de escenarios estructurada secuencialmente
    const escenarios = {
        inicio: {
            etiqueta: "Instrucciones",
            titulo: "Análisis de Casos Prácticos",
            texto: "Te enfrentarás a 5 situaciones de la vida en preparatoria. Cada situación tiene múltiples decisiones que debes tomar en cadena. Lee con cuidado, analiza y elige la mejor opción.\n\nPuntaje máximo: 100 puntos.",
            opciones: [ { texto: "Iniciar el primer caso", destino: "sit1_q1", puntos: 0 } ]
        },

        // --- SITUACIÓN 1: TRABAJO EN EQUIPO ---
        sit1_q1: {
            etiqueta: "Situación 1: Parte 1",
            titulo: "El Proyecto Incompleto",
            texto: "Es medianoche y el proyecto de Biología se entrega mañana. Un integrante acaba de avisar que 'se le olvidó' hacer su parte. ¿Qué decides hacer en este momento?",
            opciones: [
                { texto: "A) Enojarse en el grupo de WhatsApp y sacarlo del equipo inmediatamente.", destino: "sit1_q2", puntos: 0 },
                { texto: "B) Quedarte despierto hasta las 4 AM haciendo su parte para que el equipo no repruebe.", destino: "sit1_q2", puntos: 5 },
                { texto: "C) Repartir su parte entre los demás para acabar rápido, pero acordar reportarlo al profesor mañana.", destino: "sit1_q2", puntos: 10 }
            ]
        },
        sit1_q2: {
            etiqueta: "Situación 1: Parte 2",
            titulo: "El Día de la Presentación",
            texto: "Al día siguiente, llega el momento de exponer. El profesor hace una pregunta específica sobre la parte que le tocaba a tu compañero ausente. ¿Cómo respondes?",
            opciones: [
                { texto: "A) Quedarte callado y dejar que el profesor asuma que nadie estudió.", destino: "sit2_q1", puntos: 0 },
                { texto: "B) Inventar una respuesta rápida para salir del paso aunque no tenga sentido.", destino: "sit2_q1", puntos: 5 },
                { texto: "C) Admitir profesionalmente que esa sección tuvo problemas de asignación, pero explicar lo que lograron investigar anoche.", destino: "sit2_q1", puntos: 10 }
            ]
        },

        // --- SITUACIÓN 2: REDES SOCIALES ---
        sit2_q1: {
            etiqueta: "Situación 2: Parte 1",
            titulo: "El Rumor Viral",
            texto: "Ves una captura en un grupo de WhatsApp donde acusan a tu mejor amigo de hacer trampa en matemáticas. ¿Cuál es tu primera acción analítica?",
            opciones: [
                { texto: "A) Reenviar la foto a otros amigos para ver si ellos saben algo.", destino: "sit2_q2", puntos: 0 },
                { texto: "B) Ignorar el mensaje para no meterte en problemas ajenos.", destino: "sit2_q2", puntos: 5 },
                { texto: "C) Escribirle a tu amigo por privado para escuchar su versión antes de juzgar.", destino: "sit2_q2", puntos: 10 }
            ]
        },
        sit2_q2: {
            etiqueta: "Situación 2: Parte 2",
            titulo: "La Confrontación",
            texto: "Resulta que el rumor es falso. Tu amigo está furioso y quiere ir a pelear a la salida con quien envió la captura. ¿Cómo manejas esta crisis?",
            opciones: [
                { texto: "A) Apoyarlo e ir con él a la salida para que no vaya solo.", destino: "sit3_q1", puntos: 0 },
                { texto: "B) Decirle que se calme y simplemente irte a tu casa.", destino: "sit3_q1", puntos: 5 },
                { texto: "C) Convencerlo de llevar las pruebas de su inocencia a Orientación Educativa para resolverlo formalmente.", destino: "sit3_q1", puntos: 10 }
            ]
        },

        // --- SITUACIÓN 3: VOCACIÓN ---
        sit3_q1: {
            etiqueta: "Situación 3: Parte 1",
            titulo: "Elección de Área",
            texto: "Tus padres quieren que elijas el área Físico-Matemática porque 'es lo que deja dinero', pero tú tienes una fuerte vocación por las Artes Visuales.",
            opciones: [
                { texto: "A) Elegir Físico-Matemático para evitar que te regañen en casa.", destino: "sit3_q2", puntos: 0 },
                { texto: "B) Elegir Artes y ocultarles la hoja de inscripción hasta que ya no haya vuelta atrás.", destino: "sit3_q2", puntos: 5 },
                { texto: "C) Buscar carreras que combinen ambos intereses (ej. Animación Digital) y presentarles un plan de estudios.", destino: "sit3_q2", puntos: 10 }
            ]
        },
        sit3_q2: {
            etiqueta: "Situación 3: Parte 2",
            titulo: "La Presión del Orientador",
            texto: "El orientador te dice que las áreas de Artes se están llenando y debes firmar hoy mismo, pero aún no has hablado con tus padres. ¿Qué haces?",
            opciones: [
                { texto: "A) Firmar rápido por pánico y luego ver cómo le explicas a tus papás.", destino: "sit4_q1", puntos: 0 },
                { texto: "B) Falsificar la firma de tus papás para asegurar tu lugar en Artes.", destino: "sit4_q1", puntos: 0 },
                { texto: "C) Pedirle al orientador una extensión de 24 horas y agendar una cita de urgencia entre él, tus padres y tú.", destino: "sit4_q1", puntos: 10 }
            ]
        },

        // --- SITUACIÓN 4: GESTIÓN DE TIEMPO ---
        sit4_q1: {
            etiqueta: "Situación 4: Parte 1",
            titulo: "Fiesta vs Examen",
            texto: "Es jueves en la tarde. Tienes un examen vital de Historia mañana temprano, pero el chico/chica que te gusta te invitó a una fiesta hoy.",
            opciones: [
                { texto: "A) Ir a la fiesta y confiar en que podrás improvisar en el examen.", destino: "sit4_q2", puntos: 0 },
                { texto: "B) Quedarte a estudiar, pero pasar toda la noche distraído en el celular lamentando no haber ido.", destino: "sit4_q2", puntos: 5 },
                { texto: "C) Aplicar la técnica Pomodoro para estudiar intensamente 3 horas, ir a la fiesta un rato y regresar temprano.", destino: "sit4_q2", puntos: 10 }
            ]
        },
        sit4_q2: {
            etiqueta: "Situación 4: Parte 2",
            titulo: "La Pregunta Sorpresa",
            texto: "Estás en el examen de Historia y la última pregunta vale 30% de la calificación. Es sobre un tema que el profesor mencionó, pero no venía en el libro.",
            opciones: [
                { texto: "A) Intentar copiarle discretamente al compañero de al lado.", destino: "sit5_q1", puntos: 0 },
                { texto: "B) Dejarla en blanco y entregar el examen rápido para salir ya.", destino: "sit5_q1", puntos: 5 },
                { texto: "C) Escribir todo lo que recuerdas del contexto histórico e intentar deducir una respuesta lógica.", destino: "sit5_q1", puntos: 10 }
            ]
        },

        // --- SITUACIÓN 5: PRESIÓN DE PARES ---
        sit5_q1: {
            etiqueta: "Situación 5: Parte 1",
            titulo: "La Tesorería del Salón",
            texto: "Eres el tesorero. Faltan $2,000 pesos para el viaje de graduación. Un compañero popular sugiere meter el dinero en una app de apuestas deportivas para 'duplicarlo rápido'.",
            opciones: [
                { texto: "A) Aceptar para no quedar como 'aburrido' frente al salón.", destino: "sit5_q2", puntos: 0 },
                { texto: "B) Negarte, pero poner de tus propios ahorros lo que falta para que dejen de molestar.", destino: "sit5_q2", puntos: 5 },
                { texto: "C) Rechazar la idea con firmeza explicando el riesgo matemático y proponer organizar una venta de comida.", destino: "sit5_q2", puntos: 10 }
            ]
        },
        sit5_q2: {
            etiqueta: "Situación 5: Parte 2",
            titulo: "El Boicot",
            texto: "Como no quisiste apostar, el grupo de compañeros se enoja y empieza a decir que el viaje fracasará por tu culpa, poniéndote al salón en contra.",
            opciones: [
                { texto: "A) Renunciar a ser tesorero, aventarles el dinero y que ellos lo resuelvan.", destino: "evaluacion", puntos: 0 },
                { texto: "B) Aguantar los insultos en silencio esperando a que se les pase el enojo.", destino: "evaluacion", puntos: 5 },
                { texto: "C) Mostrarle al salón un archivo de Excel transparente con las finanzas y el plan seguro de la venta de comida para recuperar la confianza.", destino: "evaluacion", puntos: 10 }
            ]
        },

        // --- EVALUACIÓN FINAL ---
        evaluacion: {
            etiqueta: "Resultados",
            titulo: "Perfil Analítico Completado",
            texto: "Calculando tus resultados...",
            opciones: [ { texto: "Volver a iniciar", destino: "inicio", puntos: 0 } ]
        }
    };

    // Referencias al DOM
    const elementoTexto = document.getElementById('texto-escenario');
    const elementoTitulo = document.getElementById('titulo-escenario');
    const elementoEtiqueta = document.getElementById('etiqueta-situacion');
    const elementoBotones = document.getElementById('botones-opciones');
    const marcador = document.getElementById('marcador');

    function iniciarJuego() {
        puntuacionActual = 0;
        actualizarMarcador();
        mostrarEscenario('inicio');
    }

    function actualizarMarcador() {
        marcador.innerText = `Puntos: ${puntuacionActual} / ${puntuacionMaxima}`;
    }

    function mostrarEscenario(idEscenario) {
        if (idEscenario === 'inicio' && puntuacionActual > 0) {
            iniciarJuego();
            return;
        }

        const escenarioActual = escenarios[idEscenario];
        
        elementoEtiqueta.innerText = escenarioActual.etiqueta;
        elementoTitulo.innerText = escenarioActual.titulo;
        
        if (idEscenario === 'evaluacion') {
            let diagnostico = "";
            if (puntuacionActual >= 85) {
                diagnostico = "Nivel: PENSADOR ESTRATÉGICO.\nSobresaliente. Analizas las situaciones a profundidad, no cedes ante la presión social y buscas soluciones lógicas que benefician a todos a largo plazo.";
            } else if (puntuacionActual >= 55) {
                diagnostico = "Nivel: EN DESARROLLO.\nTienes buenas intenciones y logras evitar catástrofes, pero a menudo eliges la salida fácil o evades el conflicto en lugar de resolverlo de raíz.";
            } else {
                diagnostico = "Nivel: IMPULSIVO.\nTus decisiones son altamente emocionales o reactivas. Necesitas aprender a pausar, respirar y evaluar las consecuencias de tus actos antes de reaccionar.";
            }
            elementoTexto.innerText = `Puntaje final: ${puntuacionActual} de ${puntuacionMaxima}\n\n${diagnostico}`;
        } else {
            elementoTexto.innerText = escenarioActual.texto;
        }
        
        elementoBotones.innerHTML = '';
        
        escenarioActual.opciones.forEach(opcion => {
            const boton = document.createElement('button');
            boton.innerText = opcion.texto;
            
            if (idEscenario === 'evaluacion') {
                boton.classList.add('btn-siguiente');
            } else if (opcion.destino === 'evaluacion') {
                 boton.onclick = () => procesarDecision(opcion);
                 // Opcional: darle un estilo distinto al último botón
            }

            boton.onclick = () => procesarDecision(opcion);
            elementoBotones.appendChild(boton);
        });
    }

    function procesarDecision(opcion) {
        if (opcion.puntos > 0) {
            puntuacionActual += opcion.puntos;
            actualizarMarcador();
        }
        mostrarEscenario(opcion.destino);
    }

    iniciarJuego();
</script>

</body>
</html>
