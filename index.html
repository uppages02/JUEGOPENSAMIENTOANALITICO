<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Decisiones - Orientación Educativa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #2b2d42;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #contenedor-juego {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 750px;
            width: 100%;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #edf2f4;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 {
            margin: 0;
            font-size: 22px;
            color: #1a535c;
        }
        #marcador {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: #1a535c;
            padding: 8px 15px;
            border-radius: 8px;
        }
        h2 {
            color: #d62828;
            margin-top: 0;
        }
        p {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        button {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            background-color: #f8f9fa;
            color: #2b2d42;
            border: 2px solid #ced4da;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            text-align: left;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        button:hover {
            background-color: #edf2f4;
            border-color: #8d99ae;
            transform: translateY(-2px);
        }
        .btn-menu {
            background-color: #e0fbfc;
            border-color: #98c1d9;
            color: #000;
        }
        .btn-menu:hover {
            background-color: #98c1d9;
        }
        .btn-completado {
            background-color: #e9ecef;
            color: #adb5bd;
            border-color: #dee2e6;
            cursor: not-allowed;
            text-decoration: line-through;
        }
        .btn-completado:hover {
            transform: none;
            background-color: #e9ecef;
        }
        .btn-reinicio {
            background-color: #d62828;
            color: white;
            border: none;
            text-align: center;
            font-weight: bold;
        }
        .btn-reinicio:hover {
            background-color: #c1121f;
        }
    </style>
</head>
<body>

<div id="contenedor-juego">
    <header>
        <h1>Pensamiento Analítico en la Prepa</h1>
        <div id="marcador">Puntos: 0</div>
    </header>
    
    <h2 id="titulo-escenario">Cargando...</h2>
    <p id="texto-escenario">Preparando los sistemas...</p>
    
    <div id="botones-opciones">
        <!-- Los botones se generarán dinámicamente aquí -->
    </div>
</div>

<script>
    // Sistema de puntuación y progreso
    let puntuacionActual = 0;
    const puntuacionMaxima = 50; 
    let misionesCompletadas = []; 

    // Base de datos de los escenarios
    const escenarios = {
        pantalla_inicio: {
            titulo: "Bienvenido al Laboratorio de Decisiones",
            texto: "En la preparatoria, cada decisión cuenta. A continuación, te enfrentarás a 5 situaciones comunes de la vida estudiantil. Lee con cuidado, analiza las consecuencias a corto y largo plazo de cada opción, y elige la que consideres más inteligente. \n\nTienes 50 puntos posibles.",
            opciones: [ { texto: "Comenzar el análisis", destino: "hub_principal", puntos: 0 } ]
        },

        // RESULTADOS GENÉRICOS (Reutilizables para volver al menú)
        resultado_excelente: {
            titulo: "Análisis Óptimo (10 pts)",
            texto: "Lograste ver más allá del problema inmediato. Evaluaste los recursos, las emociones de los involucrados y elegiste la opción que resuelve la causa de raíz sin crear nuevos conflictos.",
            opciones: [ { texto: "Volver al Menú de Situaciones", destino: "hub_principal", puntos: 0 } ]
        },
        resultado_regular: {
            titulo: "Análisis Parcial (5 pts)",
            texto: "Tu decisión resuelve el problema por ahora, pero asume un costo innecesario (como sacrificar tu propio tiempo o evadir el conflicto). Atacaste el síntoma, pero no la causa.",
            opciones: [ { texto: "Volver al Menú de Situaciones", destino: "hub_principal", puntos: 0 } ]
        },
        resultado_pobre: {
            titulo: "Decisión Impulsiva (0 pts)",
            texto: "Actuaste basado en la emoción o en la gratificación inmediata. Esta decisión crea un problema mayor a largo plazo. Recuerda pausar y pensar antes de reaccionar.",
            opciones: [ { texto: "Volver al Menú de Situaciones", destino: "hub_principal", puntos: 0 } ]
        },

        // --- SITUACIÓN 1 ---
        sit1_conflicto: {
            titulo: "Situación 1: El Proyecto Grupal",
            texto: "Es casi medianoche y el proyecto final de Química se entrega mañana. Un integrante de tu equipo acaba de avisar que no hizo su parte porque 'se le olvidó'. El documento está incompleto. ¿Qué haces?",
            opciones: [
                { texto: "A) Enojarse, sacarlo del equipo y borrar su nombre sin avisar al profesor.", destino: "resultado_pobre", puntos: 0, completa: 'sit1' },
                { texto: "B) Quedarte despierto hasta las 4 AM haciendo su parte para no afectar la calificación de nadie.", destino: "resultado_regular", puntos: 5, completa: 'sit1' },
                { texto: "C) Repartir su parte entre los demás para terminar rápido, pero entregar mañana un reporte al profesor explicando la situación con evidencia.", destino: "resultado_excelente", puntos: 10, completa: 'sit1' }
            ]
        },

        // --- SITUACIÓN 2 ---
        sit2_rumor: {
            titulo: "Situación 2: El Rumor en Redes",
            texto: "Ves una captura de pantalla circulando en el grupo de WhatsApp del salón donde acusan a un amigo tuyo de hacer trampa en un examen importante. ¿Cómo procesas esta información?",
            opciones: [
                { texto: "A) Reenviarlo a otro grupo para preguntar si alguien sabe si es verdad.", destino: "resultado_pobre", puntos: 0, completa: 'sit2' },
                { texto: "B) Ignorarlo por completo para no meterte en problemas.", destino: "resultado_regular", puntos: 5, completa: 'sit2' },
                { texto: "C) Contactar a tu amigo en privado para verificar el origen del mensaje antes de formarte una opinión o reaccionar.", destino: "resultado_excelente", puntos: 10, completa: 'sit2' }
            ]
        },

        // --- SITUACIÓN 3 ---
        sit3_carrera: {
            titulo: "Situación 3: Presión Vocacional",
            texto: "Tienes que elegir área para 3er año. Te apasiona el diseño gráfico y tienes talento, pero tus padres insisten fuertemente en que elijas el área de físico-matemáticas porque 'las artes no dejan dinero'.",
            opciones: [
                { texto: "A) Elegir físico-matemáticas para evitar un conflicto familiar constante.", destino: "resultado_pobre", puntos: 0, completa: 'sit3' },
                { texto: "B) Elegir artes, no decirles nada hasta que se enteren por la escuela y rebelarte.", destino: "resultado_regular", puntos: 5, completa: 'sit3' },
                { texto: "C) Investigar carreras universitarias que combinen ambas áreas (ej. Animación 3D, Arquitectura) e iniciar una negociación con datos reales.", destino: "resultado_excelente", puntos: 10, completa: 'sit3' }
            ]
        },

        // --- SITUACIÓN 4 ---
        sit4_tiempo: {
            titulo: "Situación 4: Saturación de Tiempo",
            texto: "Es jueves. Mañana tienes un examen pesado de Historia, pero también hay una fiesta importante hoy a la que irán todos tus amigos. Estás dudando.",
            opciones: [
                { texto: "A) Ir a la fiesta y confiar en que lo que leíste en clase será suficiente para pasar.", destino: "resultado_pobre", puntos: 0, completa: 'sit4' },
                { texto: "B) Cancelar la fiesta, encerrarte a estudiar toda la noche con frustración.", destino: "resultado_regular", puntos: 5, completa: 'sit4' },
                { texto: "C) Estudiar intensamente 2 horas usando la técnica Pomodoro, e ir a la fiesta solo un rato como recompensa, regresando temprano.", destino: "resultado_excelente", puntos: 10, completa: 'sit4' }
            ]
        },

        // --- SITUACIÓN 5 ---
        sit5_finanzas: {
            titulo: "Situación 5: Tesorería del Salón",
            texto: "Eres el encargado del dinero para el viaje de fin de curso. Faltan $3,000 pesos para la meta y se acaba el tiempo. Un compañero te sugiere apostar una parte del fondo en una app de deportes 'segura' para duplicarlo rápido.",
            opciones: [
                { texto: "A) Apostar una pequeña parte. Si se pierde, lo repones tú mismo poco a poco.", destino: "resultado_pobre", puntos: 0, completa: 'sit5' },
                { texto: "B) Negarte rotundamente y poner dinero de tu propio ahorro para que el grupo no se estrese.", destino: "resultado_regular", puntos: 5, completa: 'sit5' },
                { texto: "C) Rechazar la apuesta por el alto riesgo y proponer organizar una rifa relámpago con un margen de ganancia calculado matemáticamente.", destino: "resultado_excelente", puntos: 10, completa: 'sit5' }
            ]
        },

        // --- EVALUACIÓN FINAL ---
        evaluacion_final: {
            titulo: "Diagnóstico de Pensamiento Analítico",
            texto: "Calculando tu perfil basado en tus 5 decisiones...",
            opciones: [ { texto: "Volver a jugar", destino: "reinicio_total", puntos: 0 } ]
        }
    };

    // Referencias al DOM
    const elementoTexto = document.getElementById('texto-escenario');
    const elementoTitulo = document.getElementById('titulo-escenario');
    const elementoBotones = document.getElementById('botones-opciones');
    const marcador = document.getElementById('marcador');

    function iniciarJuego() {
        puntuacionActual = 0;
        misionesCompletadas = [];
        actualizarMarcador();
        mostrarEscenario('pantalla_inicio');
    }

    function actualizarMarcador() {
        marcador.innerText = `Puntos: ${puntuacionActual} / ${puntuacionMaxima}`;
    }

    function mostrarEscenario(idEscenario) {
        // Manejo especial para reiniciar todo el juego
        if (idEscenario === 'reinicio_total') {
            iniciarJuego();
            return;
        }

        // LÓGICA DEL MENÚ CENTRAL (HUB)
        if (idEscenario === 'hub_principal') {
            if (misionesCompletadas.length === 5) {
                mostrarEscenario('evaluacion_final');
                return;
            }

            elementoTitulo.innerText = "Selecciona una Situación";
            elementoTexto.innerText = `Has completado ${misionesCompletadas.length} de 5 situaciones. ¿A qué reto te enfrentarás ahora?`;
            elementoBotones.innerHTML = '';

            const misionesMenu = [
                { id: 'sit1_conflicto', nombre: "1. El Proyecto Grupal" },
                { id: 'sit2_rumor', nombre: "2. El Rumor en Redes" },
                { id: 'sit3_carrera', nombre: "3. Presión Vocacional" },
                { id: 'sit4_tiempo', nombre: "4. Saturación de Tiempo" },
                { id: 'sit5_finanzas', nombre: "5. Tesorería del Salón" }
            ];

            misionesMenu.forEach(mision => {
                const boton = document.createElement('button');
                boton.innerText = mision.nombre;
                
                if (misionesCompletadas.includes(mision.id)) {
                    boton.classList.add('btn-completado');
                    boton.disabled = true;
                    boton.innerText += " (Completado)";
                } else {
                    boton.classList.add('btn-menu');
                    boton.onclick = () => mostrarEscenario(mision.id);
                }
                elementoBotones.appendChild(boton);
            });
            return;
        }

        // LÓGICA NORMAL PARA ESCENARIOS
        const escenarioActual = escenarios[idEscenario];
        elementoTitulo.innerText = escenarioActual.titulo;
        
        // Manejo especial del nodo de evaluación
        if (idEscenario === 'evaluacion_final') {
            let diagnostico = "";
            if (puntuacionActual >= 45) {
                diagnostico = "Rango: PENSADOR ESTRATÉGICO. Eres maduro al tomar decisiones. Evalúas el panorama completo, priorizas consecuencias a largo plazo y no te dejas llevar por impulsos. Estás muy preparado para los retos universitarios.";
            } else if (puntuacionActual >= 25) {
                diagnostico = "Rango: ANALISTA EN DESARROLLO. Tomas buenas decisiones generales, pero a veces tiendes a evitar conflictos a expensas de tu propio tiempo o esfuerzo. Recuerda que el pensamiento analítico también sirve para defender tus límites con argumentos.";
            } else {
                diagnostico = "Rango: REACTIVO / IMPULSIVO. Tu toma de decisiones se basa en resolver el problema inmediato lo más rápido posible, o de forma emocional. En Orientación Educativa trabajaremos en pausar, evaluar opciones y anticipar riesgos.";
            }
            elementoTexto.innerText = `Puntaje final: ${puntuacionActual} de ${puntuacionMaxima}\n\n${diagnostico}`;
        } else {
            elementoTexto.innerText = escenarioActual.texto;
        }
        
        // Renderizar opciones
        elementoBotones.innerHTML = '';
        escenarioActual.opciones.forEach(opcion => {
            const boton = document.createElement('button');
            boton.innerText = opcion.texto;
            
            if (idEscenario === 'evaluacion_final') {
                boton.classList.add('btn-reinicio');
            }

            boton.onclick = () => {
                // Sumar puntos
                if (opcion.puntos > 0) {
                    puntuacionActual += opcion.puntos;
                    actualizarMarcador();
                }
                // Registrar misión completada si la opción tiene el flag
                if (opcion.completa) {
                    // Mapeamos el código (sit1) al ID real (sit1_conflicto) para bloquear el botón en el menú
                    const mapaId = { sit1: 'sit1_conflicto', sit2: 'sit2_rumor', sit3: 'sit3_carrera', sit4: 'sit4_tiempo', sit5: 'sit5_finanzas' };
                    misionesCompletadas.push(mapaId[opcion.completa]);
                }
                mostrarEscenario(opcion.destino);
            };
            elementoBotones.appendChild(boton);
        });
    }

    iniciarJuego();
</script>

</body>
</html>
